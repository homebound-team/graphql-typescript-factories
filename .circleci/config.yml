version: 2.1

orbs:
  node: circleci/node@5.1.0

node-image: &node-image
  image: cimg/node:24.14.1
  auth:
    username: $DOCKERHUB_USERNAME
    password: $DOCKERHUB_ACCESS_TOKEN

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context:
            - npm-readonly
            - dockerhub
      - publish:
          context:
            - npm-trusted-publish
            - github
            - dockerhub
          requires:
            - build
          filters:
            branches:
              only:
                - main

commands:
  bootstrap:
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: true
          include-branch-in-cache-key: false

jobs:
  build:
    docker:
      - <<: *node-image
    working_directory: ~/project
    steps:
      - bootstrap
      - run: yarn build
      - run: yarn jest

  publish:
    docker:
      - <<: *node-image
    working_directory: ~/project
    steps:
      - bootstrap
      - run: yarn build
      - run: ./bump.sh package.json
      - run: |
          export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
          yarn npm publish
